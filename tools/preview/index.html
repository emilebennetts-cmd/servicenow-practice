<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DW2 preview</title><style>
/* NOTE: Jelly escapes the child-combinator character inside this style block, which silently kills any
   "parent [combinator] child" rule. Use descendant selectors here only. */
:root {
  --deep: #12363f;
  --deep-2: #0d2a31;
  --teal: #0e7c86;
  --teal-soft: #dff2f2;

  --paper: #ffffff;

  --rule: #d8e1e3;
  --critical: #c94736;
  --amber: #c78016;
  --blue: #397aa8;
  --shadow: 0 10px 32px rgba(18, 54, 63, 0.08);
  --radius: 14px;
  color-scheme: light;
  font-family: Inter, Aptos, "Segoe UI", Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--canvas); color: var(--ink); }
body { min-width: 320px; }
button, input, select, textarea { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { color: inherit; }
code, pre, .mono-id { font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; }
a { color: inherit; }

.visually-hidden { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.app-shell { min-height: 100vh; display: grid; grid-template-columns: 260px 1fr; }
.sidebar { position: fixed; inset: 0 auto 0 0; z-index: 30; width: 260px; display: flex; flex-direction: column; background: var(--deep-2); color: #fff; }
.workspace { grid-column: 2; min-width: 0; }
.brand { height: 86px; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid rgba(255,255,255,.09); }
.brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px 4px 10px 4px; background: var(--green); color: var(--deep-2); font-size: 13px; font-weight: 900; letter-spacing: -.6px; transform: rotate(-2deg); }
.brand div { display: flex; flex-direction: column; line-height: 1.05; }
.brand strong { font-size: 17px; letter-spacing: -.2px; }
.brand small { margin-top: 3px; color: #a9c1c6; font-size: 12px; text-transform: uppercase; letter-spacing: 1.6px; }
.workspace-label { padding: 22px 24px 8px; color: #7fa0a7; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; }
.sidebar nav { overflow-y: auto; padding: 4px 12px 20px; }
.nav-item { width: 100%; display: flex; align-items: center; gap: 13px; padding: 10px 12px; margin: 2px 0; border: 0; border-radius: 8px; background: transparent; color: #b9cdd1; cursor: pointer; text-align: left; font-size: 13px; font-weight: 620; transition: .16s ease; }
.nav-item:hover { color: #fff; background: rgba(255,255,255,.06); }

.nav-item.is-active .icon { color: var(--green); }
.nav-item .icon { width: 18px; height: 18px; }
.side-foot { margin-top: auto; padding: 18px 24px 24px; border-top: 1px solid rgba(255,255,255,.09); }
.progress-label { display: flex; justify-content: space-between; font-size: 11px; }
.progress-label span { color: #9bb4b9; }
.progress { height: 5px; margin: 9px 0 11px; overflow: hidden; background: rgba(255,255,255,.12); border-radius: 10px; }
.progress span { display: block; height: 100%; background: var(--green); border-radius: inherit; }
.side-foot small { color: #78979e; font-size: 10px; }

.topbar { position: sticky; top: 0; z-index: 20; height: 74px; display: flex; align-items: center; gap: 18px; padding: 0 32px; background: rgba(255,255,255,.92); border-bottom: 1px solid var(--rule); backdrop-filter: blur(12px); }
.assessment-heading { min-width: 0; display: flex; flex-direction: column; }
.assessment-heading span { color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
.assessment-heading strong { overflow: hidden; max-width: 740px; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.menu-button { display: none !important; }

main { min-height: calc(100vh - 74px); padding: 34px clamp(22px, 3.2vw, 54px) 64px; outline: none; }

.view-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin: 0 auto 28px; max-width: 1540px; }
.view-heading h1 { margin: 3px 0 7px; color: var(--deep); font-size: clamp(29px, 3vw, 42px); line-height: 1.06; letter-spacing: -1.5px; }
.view-heading p { max-width: 800px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
.eyebrow, .kicker { color: var(--teal); font-size: 10px; font-weight: 850; text-transform: uppercase; letter-spacing: 1.35px; }
.heading-actions { display: flex; gap: 9px; flex-shrink: 0; }
.button { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 17px; border: 1px solid transparent; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 750; text-decoration: none; transition: .16s ease; }
.button:hover { transform: translateY(-1px); }
.button.primary { background: var(--deep); color: #fff; box-shadow: 0 6px 16px rgba(18,54,63,.16); }
.button.primary:hover { background: var(--teal); }
.button.secondary { background: #fff; color: var(--deep); border-color: var(--rule); }
.button.secondary:hover { border-color: var(--teal); color: var(--teal); }
.button.light { background: #fff; color: var(--deep); }
.button.ghost-light { border-color: rgba(255,255,255,.4); color: #fff; background: transparent; }
.button.danger { background: #fff1ed; color: #9d3024; border-color: #f3c5bb; }
.button.compact { min-height: 34px; padding: 0 12px; }
.button.tiny { min-height: 31px; padding: 0 11px; font-size: 10px; }
.button.full { width: 100%; margin-top: 16px; }
.text-button { padding: 5px 0; border: 0; background: transparent; color: var(--teal); cursor: pointer; font-size: 11px; font-weight: 800; text-decoration: none; }
.icon-button { width: 37px; height: 37px; display: inline-grid; place-items: center; border: 1px solid var(--rule); border-radius: 8px; background: #fff; cursor: pointer; }

.hero-panel { max-width: 1540px; min-height: 345px; display: grid; grid-template-columns: 1.15fr .85fr; gap: 50px; align-items: center; margin: 0 auto 24px; padding: 46px clamp(30px, 5vw, 72px); overflow: hidden; background: linear-gradient(125deg, #0c3038, #135862); color: #fff; border-radius: 18px; box-shadow: var(--shadow); }
.hero-copy h2 { max-width: 700px; margin: 9px 0 15px; font-size: clamp(30px, 3.4vw, 52px); line-height: 1.02; letter-spacing: -2px; }
.hero-copy p { max-width: 640px; margin: 0; color: #c0d7db; font-size: 15px; line-height: 1.65; }
.hero-actions { display: flex; gap: 10px; margin-top: 26px; }
.hero-panel .kicker { color: var(--green); }
.layer-stack { display: flex; flex-direction: column; gap: 7px; perspective: 900px; }
.layer-stack div { min-height: 42px; display: flex; align-items: center; gap: 13px; padding: 0 18px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.12); border-radius: 7px; transform: translateX(calc(var(--i) * 6px)); font-size: 12px; font-weight: 720; }
.layer-stack div:first-child { background: var(--green); color: var(--deep); }
.layer-stack span { width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid currentColor; border-radius: 50%; font-size: 10px; }

.metric-grid { max-width: 1540px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin: 0 auto 22px; }
.metric-card { position: relative; min-height: 124px; padding: 20px 21px; overflow: hidden; background: #fff; border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 4px 16px rgba(18,54,63,.035); }
.metric-card::after { content: ""; position: absolute; top: 0; right: 0; width: 5px; height: 100%; background: var(--teal); }
.metric-card span { color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .8px; }
.metric-card strong { display: block; margin: 9px 0 3px; color: var(--deep); font-size: 34px; line-height: 1; letter-spacing: -1px; }
.metric-card small { color: var(--muted); font-size: 11px; }
.metric-card.critical::after { background: var(--critical); }.metric-card.amber::after { background: var(--amber); }.metric-card.blue::after { background: var(--blue); }.metric-card.green::after { background: #3c9c52; }
.compact-metrics .metric-card { min-height: 104px; }
.compact-metrics .metric-card strong { font-size: 29px; }

.dashboard-grid { max-width: 1540px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 0 auto; }
.panel { min-width: 0; padding: 22px; background: #fff; border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: 0 4px 18px rgba(18,54,63,.035); }
.span-2 { grid-column: span 2; }
.panel-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
.panel-heading h2 { margin: 3px 0 0; color: var(--deep); font-size: 19px; letter-spacing: -.45px; }
.phase-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.phase-card { display: flex; align-items: center; gap: 12px; min-height: 76px; padding: 12px; border: 1px solid var(--rule); border-radius: 9px; background: #fbfcfc; }
.phase-number { width: 35px; height: 35px; display: grid; place-items: center; flex: 0 0 35px; background: var(--teal-soft); color: var(--teal); border-radius: 50%; font-size: 10px; font-weight: 850; }
.phase-card div:last-child { min-width: 0; display: flex; flex-direction: column; }
.phase-card span { color: var(--teal); font-size: 9px; font-weight: 850; text-transform: uppercase; letter-spacing: .8px; }
.phase-card strong { margin-top: 3px; overflow: hidden; color: var(--deep); font-size: 11px; white-space: nowrap; text-overflow: ellipsis; }
.bar-list { display: grid; gap: 15px; }
.bar-list div span { display: flex; justify-content: space-between; margin-bottom: 6px; color: var(--muted); font-size: 11px; }
.bar-list b { color: var(--deep); }
.bar { height: 7px; overflow: hidden; background: #edf1f2; border-radius: 20px; }
.bar i { display: block; min-width: 3px; height: 100%; border-radius: inherit; }
.bar-p1 { background: var(--critical); }.bar-p2 { background: var(--amber); }.bar-p3 { background: var(--teal); }.bar-p4 { background: #91a4a8; }
.blocker-list { display: grid; gap: 8px; margin: 0; padding-left: 20px; color: #874436; font-size: 12px; line-height: 1.45; }
.empty-success { padding: 18px; color: #27733b; background: var(--green-soft); border-radius: 8px; font-size: 12px; }

.chip { display: inline-flex; align-items: center; width: max-content; min-height: 22px; padding: 2px 8px; border: 1px solid transparent; border-radius: 20px; background: #edf1f2; color: #53676c; font-size: 9px; font-weight: 800; line-height: 1.2; white-space: nowrap; text-transform: uppercase; letter-spacing: .4px; }
.chip-critical, .chip-validation-failed, .chip-blocked, .chip-fix-required { background: #ffede9; color: #a43225; border-color: #f5ccc3; }
.chip-high, .chip-p1 { background: #fff0e9; color: #aa4429; }
.chip-medium, .chip-p2, .chip-received, .chip-requires-review, .chip-deferred { background: #fff5d9; color: #8c650b; }
.chip-low, .chip-p3, .chip-validated, .chip-analysis-complete, .chip-fix-attached { background: #eaf8e6; color: #347a35; }
.chip-p4, .chip-not-started, .chip-superseded { background: #edf1f2; color: #65767a; }
.chip-confirmed, .chip-read-only-collection { background: var(--teal-soft); color: #166b72; }
.chip-phase-2, .chip-phase-3 { background: #edf0fa; color: #505f9d; }
.status-chip { max-width: 230px; overflow: hidden; text-overflow: ellipsis; }

.table-wrap { width: 100%; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 11px; }

td { padding: 11px 10px; border-bottom: 1px solid #e8edef; vertical-align: top; }
td strong, td small { display: block; } td small { max-width: 520px; margin-top: 3px; color: var(--muted); }
tbody tr:last-child td { border-bottom: 0; }

.form-layout { max-width: 1180px; display: grid; gap: 14px; margin: 0 auto; }
.form-section { display: grid; grid-template-columns: 58px 1fr; padding: 0; overflow: hidden; }
.section-index { display: grid; place-items: start center; padding-top: 27px; background: var(--deep); color: var(--green); font: 750 13px "Cascadia Code", monospace; }
.form-content { padding: 25px 28px 29px; }
.form-content h2 { margin: 0; color: var(--deep); font-size: 20px; }
.form-content p { margin: 5px 0 21px; color: var(--muted); font-size: 12px; }
.field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
.field { display: flex; flex-direction: column; gap: 6px; color: var(--deep); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .55px; }
.field.wide { grid-column: span 2; }
.field input, .field select, .field textarea, .list-tools select { width: 100%; min-height: 43px; padding: 10px 12px; color: var(--ink); background: #fbfcfc; border: 1px solid var(--rule); border-radius: 7px; outline: 0; font-size: 12px; font-weight: 500; text-transform: none; letter-spacing: 0; resize: vertical; }
.field textarea { min-height: 96px; }
.field input:focus, .field select:focus, .field textarea:focus, .search-box:focus-within, .list-tools select:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(14,124,134,.1); }
.callout { display: flex; gap: 12px; margin-top: 18px; padding: 13px 15px; background: #f2f8f8; border-left: 3px solid var(--teal); border-radius: 0 7px 7px 0; }
.callout strong { flex: 0 0 auto; color: var(--deep); font-size: 11px; }.callout span { color: var(--muted); font-size: 11px; line-height: 1.5; }
.callout.strong { background: #fff8e8; border-left-color: var(--amber); }
.form-actions { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; color: var(--muted); font-size: 11px; }

.workflow-legend { max-width: 1540px; display: flex; justify-content: flex-end; gap: 8px; margin: -12px auto 15px; }
.collection-board { max-width: 1540px; display: grid; grid-template-columns: repeat(6, minmax(210px, 1fr)); gap: 10px; margin: 0 auto; overflow-x: auto; padding-bottom: 15px; }
.collection-phase { min-width: 210px; }
.phase-label { position: relative; height: 46px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; background: var(--deep); color: #fff; border-radius: 8px 8px 2px 2px; text-transform: uppercase; font-size: 11px; font-weight: 850; letter-spacing: .8px; }
.collection-phase:nth-child(odd) .phase-label { background: var(--teal); }
.phase-label i { position: absolute; top: 19px; right: -8px; z-index: 2; width: 16px; height: 8px; background: var(--green); clip-path: polygon(0 0,100% 50%,0 100%); }
.collection-phase:last-child .phase-label i { display: none; }
.stage-list { display: grid; gap: 8px; }
.stage-card { min-height: 147px; display: grid; grid-template-columns: 1fr auto; padding: 15px; background: #fff; border: 1px solid var(--rule); border-radius: 9px; box-shadow: 0 3px 12px rgba(18,54,63,.03); }
.stage-status { grid-column: 1/-1; display: flex; align-items: center; justify-content: space-between; padding: 0; border: 0; background: transparent; cursor: pointer; }
.stage-status span:first-child { width: 27px; height: 27px; display: grid; place-items: center; background: var(--deep); color: #fff; border-radius: 50%; font-size: 10px; font-weight: 850; }
.stage-copy h3 { margin: 12px 0 5px; color: var(--deep); font-size: 13px; line-height: 1.2; }
.stage-copy p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.45; }
.stage-copy small { display: block; margin-top: 8px; color: var(--amber); font-size: 9px; }
.requirements { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 9px; }
.requirements span { padding: 3px 5px; background: #f0f4f5; color: #5e7378; border-radius: 4px; font-size: 8px; }
.stage-card .icon-button { align-self: end; width: 28px; height: 28px; border: 0; color: var(--teal); }

.split-layout { max-width: 1540px; min-height: 680px; display: grid; grid-template-columns: minmax(290px, 35%) 1fr; margin: 0 auto; background: #fff; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.list-pane { min-width: 0; border-right: 1px solid var(--rule); background: #fbfcfc; }
.detail-pane { min-width: 0; padding: clamp(22px, 3vw, 42px); overflow: auto; }
.list-tools { min-height: 65px; display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--rule); }
.list-tools.stacked { flex-wrap: wrap; }
.list-tools.stacked .search-box { flex-basis: 100%; }
.list-tools span { margin-left: auto; color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .6px; white-space: nowrap; }
.list-tools select { width: auto; min-width: 160px; min-height: 35px; padding: 5px 9px; font-size: 10px; }
.search-box { min-width: 0; flex: 1; display: flex; align-items: center; gap: 7px; padding: 0 10px; background: #fff; border: 1px solid var(--rule); border-radius: 7px; }
.search-box .icon { width: 15px; color: var(--muted); }
.search-box input { width: 100%; height: 34px; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 11px; }
.record-list { max-height: 760px; overflow: auto; }
.record-row { position: relative; width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; padding: 13px 15px; border: 0; border-bottom: 1px solid #e8edef; background: transparent; text-align: left; cursor: pointer; }
.record-row:hover { background: #f2f8f8; }.record-row.is-selected { background: #eaf5f5; box-shadow: inset 3px 0 var(--teal); }
.record-row strong { grid-column: 2; overflow: hidden; color: var(--deep); font-size: 11px; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; }
.record-row small { grid-column: 2; overflow: hidden; color: var(--muted); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
.record-row .mono-id { grid-row: 1/3; align-self: start; color: var(--teal); font-size: 9px; }
.record-list.dense .record-row { grid-template-columns: 8px 1fr; }.record-list.dense .record-row strong, .record-list.dense .record-row small { grid-column: 2; }.type-dot { width: 7px; height: 7px; margin-top: 4px; background: var(--teal); border-radius: 50%; }
.finding-row { grid-template-columns: 3px auto 1fr; padding-left: 0; }.finding-row .mono-id { grid-column: 2; }.finding-row strong, .finding-row small { grid-column: 3; }.severity-line { grid-row: 1/4; width: 3px; height: calc(100% + 26px); margin-top: -13px; }.severity-critical, .severity-high { background: var(--critical); }.severity-medium { background: var(--amber); }.severity-low { background: #398b4c; }.finding-row small { display: flex; align-items: center; gap: 5px; }
.list-limit { padding: 12px; color: var(--muted); text-align: center; font-size: 10px; }
.detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 22px; padding-bottom: 24px; border-bottom: 1px solid var(--rule); }
.detail-header h2 { max-width: 900px; margin: 5px 0 7px; color: var(--deep); font-size: clamp(24px, 3vw, 36px); line-height: 1.12; letter-spacing: -1px; }
.detail-header p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
.mono-id { color: var(--teal); font-size: 10px; font-weight: 750; letter-spacing: .25px; }
.finding-id { color: #c9d4d6; font: 850 42px/1 "Cascadia Code", monospace; }
.title-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.fact-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; margin: 20px 0; background: var(--rule); border: 1px solid var(--rule); border-radius: 9px; overflow: hidden; }
.fact-grid div { min-width: 0; padding: 12px; background: #f8fafa; }.fact-grid .wide { grid-column: span 2; }
.fact-grid span, .fix-grid span, .verify-grid span { display: block; color: var(--muted); font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: .7px; }
.fact-grid strong, .fact-grid code { display: block; margin-top: 5px; overflow: hidden; color: var(--deep); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
.detail-section { margin-top: 24px; }.detail-section h3 { margin: 4px 0 11px; color: var(--deep); font-size: 16px; }.detail-section p { color: var(--ink); font-size: 12px; line-height: 1.6; }
.section-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.link-chips, .component-link-list { display: flex; flex-wrap: wrap; gap: 7px; }
.link-chips button, .component-link-list button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 7px; background: #fff; cursor: pointer; text-align: left; }
.link-chips button:hover, .component-link-list button:hover { border-color: var(--teal); }.link-chips strong, .component-link-list strong { color: var(--deep); font-size: 10px; }.link-chips small, .component-link-list small, .component-link-list span { color: var(--muted); font-size: 8px; }
.source-block { margin-top: 9px; border: 1px solid #cfdadd; border-radius: 8px; overflow: hidden; }.source-block summary { padding: 9px 12px; color: #dcecee; background: var(--deep); cursor: pointer; font: 700 10px "Cascadia Code", monospace; }.source-block pre, .source-view { max-height: 520px; margin: 0; overflow: auto; padding: 15px; color: #d5e8e9; background: #0b252b; font-size: 10px; line-height: 1.6; tab-size: 2; white-space: pre; }.source-view { min-height: 300px; margin-top: 18px; border-radius: 9px; }
.narrative { margin: 18px 0; padding: 0 0 18px; border-bottom: 1px solid #e8edef; }.narrative span { color: var(--teal); font-size: 9px; font-weight: 850; text-transform: uppercase; letter-spacing: .7px; }.narrative p { margin: 7px 0 0; color: var(--ink); font-size: 12px; line-height: 1.63; }
.fix-preview { padding: 17px; background: #f4f9f9; border-radius: 9px; }.empty-inline { padding: 13px; color: var(--muted); background: #f4f7f7; border-radius: 7px; font-size: 10px; line-height: 1.5; }
.detail-actions { display: flex; gap: 9px; margin-top: 20px; }

.validation-grid { max-width: 1540px; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; margin: 16px auto 0; }
.validation-card { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 20px; background: #fff; border: 1px solid var(--rule); border-radius: 12px; }
.validation-card h3 { margin: 3px 0; color: var(--deep); font-size: 15px; }.validation-card p { margin: 0; color: var(--muted); font-size: 10px; }.validation-card ul { grid-column: 1/-1; display: grid; gap: 6px; margin: 8px 0 0; padding: 0; list-style: none; }.validation-card li { display: grid; grid-template-columns: 42px 1fr; gap: 8px; padding: 8px; background: #f7f9f9; border-radius: 6px; font-size: 9px; }.validation-card li b { color: #33834a; }.validation-card li.result-fail b { color: var(--critical); }.validation-card li span { display: flex; flex-direction: column; gap: 2px; color: var(--muted); }.validation-card li strong { color: var(--deep); }

.relationship-layout { max-width: 1540px; display: grid; grid-template-columns: 1fr 2fr; gap: 15px; margin: 0 auto; }.method-list { display: grid; gap: 7px; }.method-list div { display: flex; justify-content: space-between; gap: 12px; padding: 10px; background: #f5f8f8; border-radius: 6px; font-size: 10px; }.proposal-list { display: grid; gap: 6px; max-height: 600px; overflow: auto; }.proposal-list article { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 10px; border: 1px solid #e5ebed; border-radius: 7px; }.proposal-list article div:first-child { min-width: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; }.proposal-list strong, .proposal-list small { grid-column: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }.proposal-list strong { color: var(--deep); font-size: 10px; }.proposal-list small { color: var(--muted); font-size: 9px; }

.mode-tabs { max-width: 1540px; display: grid; grid-template-columns: repeat(3, 1fr); margin: 0 auto 14px; background: #fff; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }.mode-tabs button { display: flex; align-items: center; gap: 10px; padding: 13px 18px; border: 0; border-right: 1px solid var(--rule); background: #fff; cursor: pointer; text-align: left; }.mode-tabs button:last-child { border-right: 0; }.mode-tabs button.is-active { background: var(--deep); color: #fff; }.mode-tabs strong { font-size: 20px; }.mode-tabs span { font-size: 10px; text-transform: uppercase; letter-spacing: .7px; }
.evidence-list { display: grid; gap: 7px; }.evidence-row { border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }.evidence-row summary { display: grid; grid-template-columns: 80px minmax(180px,1fr) auto auto; align-items: center; gap: 12px; padding: 11px 13px; cursor: pointer; }.evidence-row summary strong { overflow: hidden; color: var(--deep); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }.evidence-row summary small { color: var(--muted); font-size: 9px; }.evidence-row div { padding: 15px; background: #f8fafa; border-top: 1px solid var(--rule); }.evidence-row p { color: var(--ink); font-size: 11px; line-height: 1.55; }.evidence-row dl { display: grid; grid-template-columns: 150px 1fr; margin: 0; font-size: 9px; }.evidence-row dt, .evidence-row dd { margin: 0; padding: 5px; border-bottom: 1px solid #e6ecee; }.evidence-row dt { color: var(--muted); }.evidence-row dd { color: var(--deep); }

.solution-summary { max-width: 1540px; display: grid; grid-template-columns: repeat(4,1fr); margin: 0 auto 14px; overflow: hidden; background: var(--deep); color: #fff; border-radius: 10px; }.solution-summary div { display: flex; align-items: baseline; gap: 8px; padding: 15px 18px; border-right: 1px solid rgba(255,255,255,.14); }.solution-summary strong { font-size: 22px; }.solution-summary span { color: #b8ced2; font-size: 9px; text-transform: uppercase; letter-spacing: .7px; }.fix-grid, .verify-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-top: 20px; }.fix-grid article, .verify-grid article { padding: 14px; background: #f5f8f8; border-radius: 8px; }.fix-grid p, .verify-grid p { margin: 7px 0 0; font-size: 11px; line-height: 1.5; }.step-list { padding-left: 24px; font-size: 11px; line-height: 1.55; }.step-list li { margin-bottom: 8px; padding-left: 4px; }.script-ref-list { display: flex; flex-wrap: wrap; gap: 7px; }.script-ref-list button { display: flex; gap: 7px; align-items: center; padding: 8px 10px; color: var(--deep); background: #f2f7f7; border: 1px solid var(--rule); border-radius: 6px; cursor: pointer; font-size: 10px; }.script-ref-list .icon { width: 14px; }

.roadmap-banner { max-width: 1540px; display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: 0 auto 14px; padding: 20px 24px; background: linear-gradient(105deg, var(--deep), #185d66); color: #fff; border-radius: 12px; }.roadmap-banner span { color: var(--green); font-size: 9px; font-weight: 850; text-transform: uppercase; letter-spacing: .8px; }.roadmap-banner strong { display: block; margin-top: 3px; font-size: 22px; }.roadmap-banner p { margin: 3px 0 0; color: #b8d0d4; font-size: 10px; }.roadmap-grid { max-width: 1540px; display: grid; grid-template-columns: repeat(4, minmax(230px,1fr)); gap: 10px; margin: 0 auto; overflow-x: auto; }.roadmap-column { min-width: 230px; padding: 9px; background: #e9eeee; border-radius: 10px; }.roadmap-column header { padding: 9px 8px 14px; }.roadmap-column header div { display: flex; justify-content: space-between; }.roadmap-column header span { color: var(--deep); font-weight: 900; }.roadmap-column header small { color: var(--muted); font-size: 9px; }.roadmap-column div { display: grid; gap: 7px; }.roadmap-column article { padding: 12px; background: #fff; border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; box-shadow: 0 2px 7px rgba(18,54,63,.035); }.roadmap-column article:hover { border-color: var(--teal); }.roadmap-column h3 { margin: 6px 0 12px; color: var(--deep); font-size: 11px; line-height: 1.35; }.roadmap-column footer { display: flex; align-items: center; justify-content: space-between; gap: 6px; }.roadmap-column footer span:last-child { overflow: hidden; color: var(--muted); font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }.roadmap-column.p1 { border-top: 4px solid var(--critical); }.roadmap-column.p2 { border-top: 4px solid var(--amber); }.roadmap-column.p3 { border-top: 4px solid var(--teal); }.roadmap-column.p4 { border-top: 4px solid #8ca0a5; }.empty-column { padding: 20px; color: var(--muted); text-align: center; font-size: 10px; }

.report-layout { max-width: 1350px; display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 20px; margin: 0 auto; }.report-preview { padding: 24px; background: #dfe6e7; border-radius: 14px; }.report-paper { max-width: 820px; min-height: 900px; margin: 0 auto; padding: clamp(35px,6vw,75px); background: #fff; box-shadow: 0 16px 45px rgba(18,54,63,.15); }.report-kicker { color: var(--teal); font-size: 9px; font-weight: 850; text-transform: uppercase; letter-spacing: 1.4px; }.report-paper h2 { max-width: 650px; margin: 18px 0 10px; color: var(--deep); font-size: clamp(30px,4vw,48px); line-height: 1.04; letter-spacing: -1.7px; }.report-paper p { color: var(--muted); font-size: 12px; line-height: 1.6; }.report-meta { padding-bottom: 20px; border-bottom: 2px solid var(--green); }.report-numbers { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin: 30px 0; }.report-numbers div { padding: 14px; background: #f1f6f6; }.report-numbers strong { display: block; color: var(--deep); font-size: 25px; }.report-numbers span { color: var(--muted); font-size: 8px; text-transform: uppercase; }.report-paper h3 { margin-top: 30px; color: var(--deep); font-size: 15px; }.report-paper article { display: grid; grid-template-columns: 55px 1fr auto; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 9px; }.report-paper article span { color: var(--teal); font-family: monospace; }.report-paper article strong { color: var(--deep); }.report-paper article small { color: var(--muted); }.report-gate { align-self: start; position: sticky; top: 96px; padding: 24px; background: #fff; border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); }.report-gate h2 { margin: 5px 0; color: var(--deep); font-size: 22px; }.report-gate p { color: var(--muted); font-size: 11px; line-height: 1.5; }.report-gate ul { display: grid; gap: 8px; margin: 18px 0; padding: 0; list-style: none; }.report-gate ul li { padding: 9px 9px 9px 28px; background: #fff0ec; color: #923c2f; border-radius: 6px; font-size: 10px; line-height: 1.4; }.report-gate ul li::before { content: "!"; float: left; width: 15px; height: 15px; margin-left: -20px; display: grid; place-items: center; background: var(--critical); color: #fff; border-radius: 50%; font-size: 8px; font-weight: 900; }.report-gate ul li.pass { background: var(--green-soft); color: #2d6f3a; }.report-gate ul li.pass::before { content: "✓"; background: #3d994f; }

.timeline article { display: grid; grid-template-columns: 32px 1fr; gap: 14px; padding-bottom: 22px; }.timeline-dot { width: 27px; height: 27px; display: grid; place-items: center; z-index: 1; background: var(--deep); color: var(--green); border-radius: 50%; font: 700 8px monospace; }.timeline article div { position: relative; padding-bottom: 7px; }.timeline article div::before { content: ""; position: absolute; top: 0; bottom: -23px; left: -31px; width: 1px; background: var(--rule); }.timeline article:last-child div::before { display: none; }.timeline time { color: var(--muted); font-size: 9px; }.timeline h3 { margin: 3px 0; color: var(--deep); font-size: 12px; }.timeline p { margin: 0; color: var(--muted); font-size: 10px; }
.admin-grid { max-width: 1200px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 0 auto; }.admin-grid h2 { margin: 5px 0 16px; color: var(--deep); font-size: 20px; }.fact-grid.vertical { grid-template-columns: 1fr; }.check-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }.check-list li { padding-left: 24px; color: var(--ink); font-size: 11px; }.check-list li::before { content: "✓"; float: left; margin-left: -24px; color: #359449; font-weight: 900; }.status-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }.status-grid div { padding: 14px; background: #f6f9f9; border-radius: 8px; }.status-grid p { color: var(--muted); font-size: 10px; line-height: 1.5; }

.empty-state { min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; color: var(--muted); text-align: center; }.empty-state span { width: 50px; height: 50px; display: grid; place-items: center; margin-bottom: 12px; background: #edf3f3; color: var(--teal); border-radius: 50%; }.empty-state strong { color: var(--deep); font-size: 14px; }.empty-state p { max-width: 360px; margin: 6px 0; font-size: 11px; line-height: 1.5; }.empty-large { margin-top: 30px; padding: 40px; background: #f5f8f8; border-radius: 10px; text-align: center; }.empty-large strong { color: var(--deep); }.empty-large p { max-width: 540px; margin: 8px auto; color: var(--muted); font-size: 11px; line-height: 1.5; }
.busy-layer { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; background: rgba(9,31,37,.72); color: #fff; backdrop-filter: blur(3px); font-size: 13px; }.spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.24); border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; }.toast { position: fixed; right: 24px; bottom: 24px; z-index: 110; max-width: 420px; padding: 12px 16px; background: var(--deep); color: #fff; border-left: 4px solid var(--green); border-radius: 7px; box-shadow: var(--shadow); font-size: 11px; animation: slide-in .2s ease-out; }
@keyframes spin { to { transform: rotate(360deg); } } @keyframes slide-in { from { transform: translateY(8px); opacity: 0; } }

.guidance-section, .output-pipeline { max-width: 1540px; margin: 0 auto 24px; }
.guidance-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 14px; padding: 0 2px; }
.guidance-heading h2 { margin: 4px 0 5px; color: var(--deep); font-size: 22px; letter-spacing: -.55px; }
.guidance-heading p { max-width: 820px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
.guidance-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.guidance-grid.compact { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.guidance-card { min-width: 0; overflow: hidden; background: #fff; border: 1px solid var(--rule); border-radius: 13px; box-shadow: 0 5px 20px rgba(18,54,63,.045); }
.guidance-card.is-missing { border-top: 4px solid var(--amber); }
.guidance-card.is-ready { border-top: 4px solid #439c51; }
.guidance-card header { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 13px; align-items: start; padding: 19px 20px 16px; }
.guide-order { width: 40px; height: 40px; display: grid; place-items: center; color: var(--deep); background: var(--teal-soft); border-radius: 50%; font: 850 11px "Cascadia Code", monospace; }
.guidance-card h3 { margin: 4px 0 6px; color: var(--deep); font-size: 17px; letter-spacing: -.3px; }
.guidance-card header p, .guide-purpose p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.55; }
.guide-purpose { margin: 0 20px 15px; padding: 13px 15px; background: #f3f8f8; border-left: 3px solid var(--teal); border-radius: 0 7px 7px 0; }
.guide-purpose strong { display: block; margin-bottom: 4px; color: var(--deep); font-size: 10px; }
.guidance-columns { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 1px; margin: 0 20px 15px; overflow: hidden; background: var(--rule); border: 1px solid var(--rule); border-radius: 9px; }
.guidance-columns section { min-width: 0; padding: 13px; background: #fbfcfc; }
.guidance-columns ul { margin: 9px 0 0; padding-left: 17px; color: var(--ink); font-size: 9px; line-height: 1.5; }
.guidance-columns li { margin-bottom: 5px; }
.guidance-columns code { overflow-wrap: anywhere; font-size: 8px; }
.runbook { margin: 0 20px 16px; border: 1px solid var(--rule); border-radius: 8px; background: #fff; }
.runbook summary { padding: 11px 13px; color: var(--deep); background: #f5f8f8; cursor: pointer; font-size: 10px; font-weight: 800; }
.runbook ol { margin: 0; padding: 14px 18px 14px 38px; color: var(--ink); font-size: 10px; line-height: 1.55; }
.runbook li { margin-bottom: 8px; padding-left: 3px; }
.guidance-card footer { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; padding: 13px 20px; background: #f7f9f9; border-top: 1px solid var(--rule); }
.guide-compact-meta { display: flex; justify-content: space-between; gap: 12px; padding: 0 20px 17px; color: var(--muted); font-size: 9px; }
.guide-compact-meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.guide-compact-meta strong { flex: 0 0 auto; color: var(--teal); }
.guidance-grid.compact .guidance-card header { grid-template-columns: 34px minmax(0,1fr); padding: 16px; }
.guidance-grid.compact .guidance-card header .chip { grid-column: 2; }
.guidance-grid.compact .guide-order { width: 32px; height: 32px; }
.guidance-grid.compact .guidance-card h3 { font-size: 14px; }
.guidance-grid.compact .guidance-card footer { padding: 11px 16px; }
.stage-scripts { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 10px; }
.stage-scripts small { width: 100%; color: var(--muted); font-size: 8px; text-transform: uppercase; letter-spacing: .6px; }
.stage-scripts button { padding: 3px 6px; color: var(--teal); background: #fff; border: 1px solid #bdd7da; border-radius: 4px; cursor: pointer; font: 750 8px "Cascadia Code", monospace; }
.output-pipeline { padding: 22px; background: linear-gradient(120deg, #0f3038, #15545d); color: #fff; border-radius: 14px; box-shadow: var(--shadow); }
.output-pipeline .guidance-heading h2 { color: #fff; }
.output-pipeline .guidance-heading p { color: #bdd2d6; }
.output-pipeline .eyebrow { color: var(--green); }
.pipeline-steps { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 8px; }
.pipeline-steps article { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 12px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; }
.pipeline-steps article span { width: 25px; height: 25px; display: grid; place-items: center; flex: 0 0 25px; border: 1px solid currentColor; border-radius: 50%; font-size: 9px; font-weight: 850; }
.pipeline-steps article.is-ready span { color: var(--deep); background: var(--green); border-color: var(--green); }
.pipeline-steps article.is-waiting { color: #92adb2; }
.pipeline-steps div { min-width: 0; }
.pipeline-steps strong, .pipeline-steps small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pipeline-steps strong { color: #fff; font-size: 10px; }
.pipeline-steps small { margin-top: 3px; font-size: 8px; }
.pipeline-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.script-runbook { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0; }
.script-runbook div { padding: 15px; background: #f4f8f8; border: 1px solid var(--rule); border-radius: 8px; }
.script-runbook strong { display: block; margin: 6px 0; color: var(--deep); font-size: 11px; line-height: 1.4; }
.script-runbook p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
.template-warning { display: flex; gap: 14px; margin: 18px 0; padding: 14px 16px; color: #82430e; background: #fff4df; border: 1px solid #edcf99; border-left: 4px solid var(--amber); border-radius: 8px; }
.template-warning strong { flex: 0 0 auto; font-size: 11px; }
.template-warning span { font-size: 10px; line-height: 1.5; }
.template-warning code { padding: 2px 5px; background: #fff; border-radius: 4px; }
.explorer-generator { max-width: 1350px; margin: 24px auto 0; padding: 28px; background: #fff; border: 1px solid var(--rule); border-top: 5px solid var(--amber); border-radius: 14px; box-shadow: var(--shadow); }
.explorer-generator.is-ready { border-top-color: var(--green); background: linear-gradient(145deg, #fff, #f5fbf3); }
.generator-copy h2 { margin: 5px 0 8px; color: var(--deep); font-size: 26px; letter-spacing: -.7px; }
.generator-copy p { max-width: 1000px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
.generator-checks { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 8px; margin: 20px 0; }
.generator-checks article { display: flex; align-items: center; gap: 9px; min-width: 0; padding: 11px; background: #f6f8f8; border: 1px solid var(--rule); border-radius: 8px; }
.generator-checks article span { width: 23px; height: 23px; display: grid; place-items: center; flex: 0 0 23px; border-radius: 50%; color: #fff; background: var(--amber); font-size: 10px; font-weight: 900; }
.generator-checks article.pass span { background: #439c51; }
.generator-checks article div { min-width: 0; }
.generator-checks strong, .generator-checks small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.generator-checks strong { color: var(--deep); font-size: 9px; }
.generator-checks small { margin-top: 3px; color: var(--muted); font-size: 8px; }
.generator-blockers, .generator-ready { display: flex; gap: 16px; padding: 15px 17px; border-radius: 8px; }
.generator-blockers { align-items: flex-start; color: #8f3b2f; background: #fff0ec; }
.generator-blockers strong { flex: 0 0 auto; font-size: 11px; }
.generator-blockers ul { display: grid; gap: 5px; margin: 0; padding-left: 18px; font-size: 10px; line-height: 1.45; }
.generator-ready { align-items: center; color: #2f743c; background: var(--green-soft); }
.generator-ready strong { flex: 0 0 auto; font-size: 12px; }
.generator-ready span { font-size: 10px; }
.generator-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 18px; }
.generator-actions .button[disabled] { cursor: not-allowed; opacity: .45; transform: none; }

@media (max-width: 1180px) {
  .app-shell { grid-template-columns: 220px 1fr; }.sidebar { width: 220px; }.workspace { grid-column: 2; }
  .dashboard-grid { grid-template-columns: 1fr 1fr; }.dashboard-grid .span-2 { grid-column: span 2; }
  .collection-board { grid-template-columns: repeat(6, 240px); }
  .report-layout { grid-template-columns: 1fr 300px; }
  .guidance-grid.compact { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .pipeline-steps { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .generator-checks { grid-template-columns: repeat(3, minmax(0,1fr)); }
}
